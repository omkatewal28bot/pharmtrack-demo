<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>PharmTrack - Pharmacy Management System</title>

    <!-- External CSS File -->

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

    <!-- ================================= -->
    <!-- Login and Registration Section    -->
    <!-- ================================= -->

    <section id="auth">

        <div id="login">

            <h1>PharmTrack</h1>

            <p class="sub">
                Secure Pharmacy Inventory
            </p>

            <form id="authform">

                <!-- Registration Fields -->

                <div id="regfields" class="hide">

                    <label for="uname">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="uname"
                        maxlength="100"
                        placeholder="Enter your name"
                    >

                    <!-- User Role Selection -->

                    <label for="urole">
                        Select Role
                    </label>

                    <select id="urole">

                        <option value="viewer">
                            Viewer
                        </option>

                        <option value="shopkeeper">
                            Shopkeeper
                        </option>

                    </select>

                </div>

                <!-- Email Address -->

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <!-- Password -->

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <!-- Login Button -->

                <button
                    type="submit"
                    class="btn"
                    id="authsubmit"
                >
                    Sign In
                </button>

            </form>

            <!-- Authentication Message -->

            <p
                class="err"
                id="authmsg"
                role="status"
            >
            </p>

            <!-- Registration Button -->

            <button
                type="button"
                class="btn alt"
                id="switchauth"
            >
                Create Account
            </button>

            <p class="demo-note">
                Shopkeeper registration requires
                admin approval.
            </p>

        </div>

    </section>

    <!-- ================================= -->
    <!-- Main Application Section          -->
    <!-- ================================= -->

    <div id="app" class="hide">

        <!-- Navigation Header -->

        <header class="nav">

            <div class="header-top">

                <!-- Website Name -->

                <b>PharmTrack</b>

                <!-- User Information -->

                <div class="who">

                    <!-- Database Connection Status -->

                    <span id="dbstatus">
                    </span>

                    <!-- Logged-in User and Role -->

                    <span id="identity">
                    </span>

                    <!-- Logout Button -->

                    <button
                        type="button"
                        class="btn alt sm"
                        id="logout"
                    >
                        Logout
                    </button>

                </div>

            </div>

            <!-- Navigation Menu -->

            <nav
                class="tabs"
                id="tabs"
            >
            </nav>

        </header>

        <!-- Main Dashboard Content -->

        <main
            class="page"
            id="main"
        >
        </main>

    </div>

    <!-- ================================= -->
    <!-- Medicine Details Dialog Box       -->
    <!-- ================================= -->

    <div id="modal" class="hide">

        <div
            class="box"
            id="mbody"
            role="dialog"
            aria-modal="true"
        >
        </div>

    </div>

    <!-- ================================= -->
    <!-- External JavaScript File          -->
    <!-- ================================= -->

    <script src="/static/script.js" defer></script>

</body>

</html>
