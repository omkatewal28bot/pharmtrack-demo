.err{color:var(--dang);font-size:13px;min-height:1.2em;margin:.6rem 0 0;text-align:left}
.sw{margin:1rem 0}
.sw a{color:var(--brand);cursor:pointer;text-decoration:none}
.demo{background:var(--sub);border-radius:6px;padding:.8rem .9rem;text-align:left;font-size:13px;color:var(--mute)}

.banner.ok{background:var(--safeb);color:var(--safe);border-color:transparent}

.box{background:var(--surf);border:1px solid var(--line);border-radius:8px}

.mc{background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:1rem 1.1rem;cursor:pointer;text-align:left;width:100%}
.mc:hover{border-color:var(--c)}

.tw{overflow-x:auto;border-radius:8px}

tbody tr{cursor:pointer}tbody tr:hover{background:var(--sub)}

.al{background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:.7rem 1rem;margin-bottom:.6rem;display:flex;justify-content:space-between;gap:1rem;cursor:pointer;flex-wrap:wrap}

 $('#cds').innerHTML=l.length?l.map(m=>{const u=m.items.reduce((a,x)=>a+x.stock,0),r=m.items.reduce((a,x)=>a+x.reorder,0),s=u===0?'Out':u<r?'Low-stock':'In';return `<button class="mc c-${T2S[s]}" onclick="openMed('${esc(m.name)}')"><div class="r"><strong>${m.name}</strong>${tag(T2S[s],TL[s])}</div><small>${CAT[m.cat][0]} · ${m.form}</small><div class="big">${fmt(u)} <span>units</span></div><div class="f"><span>${m.items.length} strengths</span><span>${m.mfr}</span></div></button>`}).join(''):'<div class="empty">No medicines found for that search.</div>'}

/* alerts + admin */
function alerts(){const A=[];DB.forEach(m=>{if(m.expired)A.push([0,m,'Expired – '+fmt(m.stock)+' units must be removed from stock','Danger']);else if(m.stock&&m.level==='Critical')A.push([1,m,'Expires in '+m.dte+' days with '+fmt(m.waste)+' units unlikely to sell','Danger']);else if(!m.stock)A.push([2,m,'Out of stock – reorder now','Danger']);else if(m.stock&&m.level==='High')A.push([3,m,'High expiry risk – dispense first','Warning']);else if(m.status==='Low-stock')A.push([4,m,'Low stock – '+fmt(m.stock)+' left, reorder level '+fmt(m.reorder),'Warning'])});
 A.sort((a,b)=>a[0]-b[0]);$('#main').innerHTML=head('Alerts',`${A.length} active alerts, most urgent first.`)+A.slice(0,60).map(([,m,t,s])=>`<div class="al c-${s}" onclick="openMed('${esc(m.name)}')"><span><b>${m.name} ${m.strength}</b> · ${m.batch}<br><span class="muted">${t}</span></span>${tag(s,s)}</div>`).join('')+(A.length>60?`<p class="muted">Showing the 60 most urgent alerts.</p>`:'')}
function openMed(n){const m=MEDS[n],c=CAT[m.cat];
 $('#mbody').innerHTML=`<div style="display:flex;justify-content:space-between;gap:1rem"><div><h2>${m.name}</h2><span class="muted">${c[0]} · ${m.form}</span></div><button class="btn alt sm" id="x">Close</button></div>
 <dl class="dl"><dt>Used for</dt><dd>See verified product information</dd><dt>Common side effects</dt><dd>See package leaflet</dd><dt>Storage</dt><dd>Follow product label</dd><dt>Manufacturer</dt><dd>${m.mfr}</dd></dl>
 <h3 style="font-size:1rem;margin-bottom:.5rem">Stock by strength</h3><div class="tw"><table style="min-width:520px"><thead><tr><th>Strength</th><th>Available</th><th>Expiry</th><th>Risk</th><th>Price</th></tr></thead><tbody>${m.items.map(x=>`<tr style="cursor:default"><td>${x.strength}</td><td class="n">${fmt(x.stock)}</td><td>${dt(x.expiry)}</td><td>${x.stock?lt(x):tag('Danger','Out of stock')}</td><td>${inr(x.price)}</td></tr>`).join('')}</tbody></table></div>
 <p class="muted" style="font-size:12px;margin-bottom:0">Illustrative category information and synthetic stock data; not verified product-specific guidance. Check the actual medicine label and pharmacist guidance.</p>`;
 $('#modal').classList.remove('hide');$('#x').focus();$('#x').onclick=closeM}
function closeM(){$('#modal').classList.add('hide')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
const V=[['dash','Dashboard'],['add','+ Add Medicine'],['states','States'],['usability','Usability'],['info','Knowledge']];
$('#tabs').innerHTML=V.map(([k,l])=>`<button data-v="${k}">${l}</button>`).join('');$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)};
const expandedSeeds=DB.filter(m=>m.id.startsWith("PT-EX-")||m.id.startsWith("PT-OLD-"));let online=false;
function rebuild(){Object.keys(MEDS).forEach(k=>delete MEDS[k]);DB.forEach(m=>{m.expiry=new Date(m.expiry);m.dte=Math.round((m.expiry-NOW)/DAY);m.expired=m.dte<0&&m.stock>0;m.level=m.dte<0?'Critical':m.dte<=30?'High':m.dte<=90?'Medium':'Low';m.status=m.stock?'In':'Out';(MEDS[m.name]??={name:m.name,cat:m.cat,mfr:m.mfr,form:m.form,items:[]}).items.push(m)})}
async function api(path,method='GET',data){const r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json'},...(data===undefined?{}:{body:JSON.stringify(data)})});if(!r.ok)throw Error(await r.text());return r.json()}
async function init(){try{await api('inventory');await api('seed','POST',{medicines:DB});let data=await api('inventory');DB.splice(0,DB.length,...data.medicines);online=true;$('#dbstatus').textContent='MongoDB connected'}catch(e){try{let d=JSON.parse(localStorage.getItem('pt_inventory_v2'));if(d&&Array.isArray(d.medicines)){DB.splice(0,DB.length,...d.medicines);if(!d.usabilityExpanded){const ids=new Set(DB.map(m=>m.id));DB.push(...expandedSeeds.filter(m=>!ids.has(m.id)));}}localStorage.setItem('pt_inventory_v2',JSON.stringify({medicines:DB,expanded:true,usabilityExpanded:true}))}catch(e){}$('#dbstatus').textContent='Local demo — MongoDB not connected'}rebuild();go('dash')}
async function saveChange(path,method,data,local){try{if(online)await api(path,method,data);local();rebuild();if(!online)localStorage.setItem('pt_inventory_v2',JSON.stringify({medicines:DB,expanded:true,usabilityExpanded:true}));return true}catch(e){alert('Save failed: '+e.message);return false}}
async function editBatch(i){let m=DB[i];let q=prompt('New quantity',m.stock);if(q===null)return;let p=prompt('New price',m.price);if(p===null)return;let ex=prompt('Expiry date (YYYY-MM-DD)',m.expiry.toISOString().slice(0,10));if(ex===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(ex)||!Number.isFinite(Date.parse(ex))||!Number.isInteger(+q)||+q<0||!Number.isFinite(+p)||+p<0)return alert('Invalid values');let patch={stock:+q,price:+p,expiry:new Date(ex+'T00:00:00').toISOString()};if(await saveChange('medicines/'+encodeURIComponent(m.id),'PATCH',patch,()=>Object.assign(m,patch)))go('dash')}
async function deleteBatch(i){let m=DB[i];if(confirm('Delete '+m.name+'?')&&await saveChange('medicines/'+encodeURIComponent(m.id),'DELETE',undefined,()=>DB.splice(i,1)))go('dash')}
init();
</script></body></html>
